name: shinelight

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: shinelight-backend:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shinelight}
      POSTGRES_USER: ${POSTGRES_USER:-shinelight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shinelight}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  backend:
    <<: *backend

  worker:
    <<: *backend
    environment:
      SKIP_MIGRATIONS: "1"
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true

  beat:
    <<: *backend
    environment:
      SKIP_MIGRATIONS: "1"
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

  # Optional S3-compatible document storage. Start with: docker compose --profile minio up -d
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-shinelight}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-please}
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  media:
  miniodata:
